[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nomagic"
version = "0.1.0"
description = "Detect magic numbers in source code."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
nomagic = "nomagic.cli:main"
